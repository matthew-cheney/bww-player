<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BWW Player</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main>
      <h1>BWW Player</h1>
      <label for="bww">Bagpipe Music Writer text</label>
      <textarea id="bww" rows="12" spellcheck="false" autocomplete="off"
        placeholder="Paste a BWW tune here"></textarea>
      <div class="controls">
        <button type="button" disabled>Play</button>
        <button type="button" disabled>Stop</button>
      </div>
      <p role="status">Playback is still in development.</p>
    </main>
  </body>
</html>
